<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ArtCraft 3D / Splat Viewer</title>
<style>body{font-family:system-ui;margin:0;padding:12px;background:#0a0a0a;color:#eee}
canvas{width:100%;height:320px;background:#18181b;border-radius:8px}</style></head><body>
<div id="stage"><div style="opacity:.6">3D / splat preview appears here when a result includes a .glb/.ply/.splat URL.</div></div>
<script type="module">
window.addEventListener('message',(ev)=>{
  const d=ev.data||{};
  if(d.method==='ui/notifications/tool-result'&&d.params){
    const txt=(d.params.content||[]).map(c=>c.text||'').join(' ');
    const m=txt.match(/https?:\/\/[^\s`"')]+\.(glb|ply|splat)/i);
    const s=document.getElementById('stage');
    if(m){s.innerHTML='<div>3D asset: <a style="color:#818cf8" href="'+m[0]+'">'+m[0].split('/').pop()+'</a> — interactive WebGL preview requires host support.</div>'}
  }
},false);
</script></body></html>
