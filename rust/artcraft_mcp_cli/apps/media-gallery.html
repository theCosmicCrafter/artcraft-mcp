<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ArtCraft Media Gallery</title>
<style>
body{font-family:system-ui;margin:0;padding:12px;background:var(--color-background-primary,#111);color:var(--color-text-primary,#eee)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{border-radius:8px;overflow:hidden;background:#222;padding:6px}
.card img,.card video{width:100%;border-radius:6px}
.cap{font-size:12px;opacity:.8;margin-top:4px;word-break:break-all}
</style></head><body>
<h3 style="margin-top:0">Media Gallery</h3>
<div class="grid" id="grid"></div>
<script>
window.addEventListener('message',(ev)=>{
  const d=ev.data||{};
  if(d.method==='ui/notifications/tool-result'&&d.params){
    try{
      const sc=d.params.structuredContent||{};
      const items=sc.items||[];
      const g=document.getElementById('grid');g.innerHTML='';
      for(const it of items){
        const c=document.createElement('div');c.className='card';
        const url=it.url||'';
        if(/\.(mp4|webm|mov)/i.test(url)){c.innerHTML='<video controls src="'+url+'"></video>'}
        else if(/\.(png|jpe?g|webp|gif)/i.test(url)){c.innerHTML='<img src="'+url+'">'}
        else{c.innerHTML='<div class="cap">file</div>'}
        c.innerHTML+='<div class="cap">'+(it.token||'')+'</div>';
        g.appendChild(c);
      }
      if(!items.length){g.innerHTML='<div class="cap" id="empty">No media items in result.</div>'}
    }catch(e){}
  }
},false);
</script><script>
// MCP Apps handshake: hosts gate tool-result delivery on ui/initialize.
(function(){
  function ready(){
    if(!window.parent||window.parent===window)return;
    window.parent.postMessage({jsonrpc:'2.0',id:'ui-init',method:'ui/initialize',params:{protocolVersion:'2026-01-26',appInfo:{name:'artcraft-mcp-app',version:'2.0.0'},appCapabilities:{availableDisplayModes:['inline']}}},'*');
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',ready)}else{ready()}
  window.addEventListener('message',function(ev){
    var d=ev.data||{};
    if(d.id==='ui-init'&&d.result){
      window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');
    }
  },false);
})();
</script>
</body></html>
